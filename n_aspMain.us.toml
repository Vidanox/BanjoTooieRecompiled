# Banjo-Tooie's n_aspMain (USA)
#
# Derived from decomp/baserom.us.yaml:
#   [0x1E4F3B0, textbin, n_aspMain]   -> next entry rspboot at 0x1E50B80
#   [0x1E59B40, rodatabin, n_aspMain] -> the data blob, which BEGINS with an
#                                        overlay descriptor table
#
# Descriptor table at ROM 0x1E59B40 (u32 offset, u16 size-1, u16 imem_addr):
#   desc0: offset 0x000, size 0xF80, addr 0x1080  -> 0x1080..0x2000 (IMEM top)
#   desc1: offset 0xF80, size 0x848, addr 0x1238  -> 0x1238..0x1A80
#   0xF80 + 0x848 = 0x17C8, region is 0x17D0 (8 bytes tail padding)
#
# So unlike Banjo-Kazooie's n_aspMain (flat 0xC60, no overlays), Tooie's has a
# base image that exactly fills IMEM plus ONE overlay slot.
text_offset = 0x1E4F3B0
text_size = 0xF80
text_address = 0x04001080
rom_file_path = "build/decompressed.us.z64"
output_file_path = "rsp/n_aspMain.cpp"
output_function_name = "n_aspMain"

# Dispatch table read by `lh $1, 0x10($1)` at IMEM 0x10FC (jr $1 at 0x1100).
# 16 halfword entries living at DMEM 0x10..0x30 in the data blob; entry 16
# (0xF000) is not an IMEM address, which is where the table ends.
extra_indirect_branch_targets = [
    0x1AE8, 0x143C, 0x1240, 0x1D84, 0x126C, 0x1B20, 0x12A8, 0x1214,
    0x141C, 0x1310, 0x13CC, 0x12E4, 0x1FB0, 0x1358, 0x16EC, 0x1408,
]

[[overlay_slots]]
text_address = 0x04001238
overlays = [
    { offset = 0xF80, size = 0x848 },
]
