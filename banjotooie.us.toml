# Config file for Banjo-Tooie (USA) static recompilation.
# Modeled on BanjoRecomp's banjo.us.rev0.toml.

[input]
entrypoint = 0x80000400
output_func_path = "RecompiledFuncs"
rom_file_path = "build/decompressed.us.z64"
symbols_file_path = "build/banjotooie.us.syms.toml"
relocatable_sections_path = "build/sections.txt"
bss_section_suffix = "_bss"
# Measured: every generated translation unit pays ~130 ms to parse the 1.2 MB
# funcs.h declaration list, plus ~50 ms of compiler process startup, before any
# code is generated. At 8 functions per file that fixed cost is paid 2337 times
# and dominates a full rebuild (~2 minutes on 6 cores); the actual codegen is
# only ~100 s of CPU in total. 128 keeps the fixed cost near zero while leaving
# a single changed function cheap to rebuild.
functions_per_output_file = 256
recomp_include = "#include \"tooie_recomp.h\""

[patches]

# Functions the recompiler should not emit code for (handled by the runtime).
stubs = [
    # Audit result: the `boot_*` copies are the boot segment's own libultra,
    # whose raw implementations touch MMIO and must be replaced by the runtime;
    # `func_80032558` is the only non-boot function N64Recomp cannot emit
    # (mfc0 BadVAddr). Every other entry the list used to carry was stale and
    # was silently deleting game logic -- `func_80800484_chintrochar` was
    # deleting the only call that creates an actor's spline/expression
    # resource, which made the intro cutscene dereference a NULL handle.
    "boot___createSpeedParam",
    "boot___ll_div",
    "boot___ll_lshift",
    "boot___ll_mod",
    "boot___ll_mul",
    "boot___ll_rem",
    "boot___ll_rshift",
    "boot___osCleanupThread",
    "boot___osDequeueThread",
    "boot___osDevMgrMain",
    "boot___osDisableInt",
    "boot___osDispatchThread",
    "boot___osEPiRawReadIo",
    "boot___osEPiRawStartDma",
    "boot___osEPiRawWriteIo",
    "boot___osEnqueueAndYield",
    "boot___osEnqueueThread",
    "boot___osExceptionPreamble",
    "boot___osGetCause",
    "boot___osGetSR",
    "boot___osPiCreateAccessQueue",
    "boot___osPopThread",
    "boot___osProbeTLB",
    "boot___osResetGlobalIntMask",
    "boot___osRestoreInt",
    "boot___osSetFpcCsr",
    "boot___osSetGlobalIntMask",
    "boot___osSetSR",
    "boot___osSiDeviceBusy",
    "boot___osSiRawReadIo",
    "boot___osSiRawWriteIo",
    "boot___ull_div",
    "boot___ull_divremi",
    "boot___ull_rem",
    "boot___ull_rshift",
    "boot_osCreateMesgQueue",
    "boot_osCreatePiManager",
    "boot_osCreateThread",
    "boot_osDestroyThread",
    "boot_osGetThreadPri",
    "boot_osInvalICache",
    "boot_osMapTLBRdb",
    "boot_osPiGetStatus",
    "boot_osRecvMesg",
    "boot_osSendMesg",
    "boot_osSetEventMesg",
    "boot_osSetIntMask",
    "boot_osSetThreadPri",
    "boot_osStartThread",
    "boot_osUnmapTLBAll",
    "boot_osVirtualToPhysical",
    "boot_osWritebackDCache",
    "boot_osYieldThread",
    "func_80032558",
]

# Functions to skip entirely.
#
# `wait_one_frame` is defined by N64ModernRuntime
# (librecomp/src/vi.cpp:47), which spins on the runtime's VI counter. The
# recompiled copy would define the same symbol and collide at link time, so
# suppress it and let the runtime's definition satisfy the callers.
ignored = [
    "wait_one_frame",
]

# Functions whose recompiled names should be exposed for patch replacement.
renamed = [
]

# ---------------------------------------------------------------------------
# Overlay syscall subsystem hooks (see src/recomp_api.cpp).
#
# Tooie's ROM reader and overlay relocation-key reader use raw PI MMIO that
# cannot run on the host; the runtime supplies the data from its ROM image.
# ---------------------------------------------------------------------------

[[patches.hook]]
func = "func_8001E210"
before_vram = 0x8001E210
text = "tooie_rom_read_word(rdram, ctx); return;"

# Boot-local PI DMA reads ROM directly; route it through the runtime's ROM.
[[patches.hook]]
func = "boot___osPiRawStartDma"
before_vram = 0x80001A40
text = "tooie_boot_pi_raw_start_dma(rdram, ctx); return;"

# The boot loader inflates core1 into its final RDRAM range without a PI DMA the
# runtime can see; register the section and reproduce IPL3's CIC boot words.
[[patches.hook]]
func = "func_80000450"
before_vram = 0x80000518
text = "tooie_boot_register_core1(rdram, ctx);"

# core2 is expanded straight into its final RDRAM range by the boot
# decompressor (`func_80019EC0`, called at 0x800122BC with 0x1E5AEB0/0x800815C0
# in its argument list), so no PI DMA the runtime can observe ever registers
# that section either. Register it as soon as the decompression returns, before
# any core2 function pointer has to resolve through LOOKUP_FUNC.
[[patches.hook]]
func = "func_80012214"
before_vram = 0x800122C4
text = "tooie_boot_register_core2(rdram, ctx);"

# Reads CP0 Count via a hardware path the runtime does not model.
[[patches.hook]]
func = "func_80014A54"
before_vram = 0x80014A54
text = "return;"

# TEMPORARY diagnostics.
[[patches.hook]]
func = "func_800006D4"
before_vram = 0x800006D4
text = "tooie_probe(rdram, ctx, 1); tooie_dump(rdram, 0x80200000);"

[[patches.hook]]
func = "boot_inflate"
before_vram = 0x800007AC
text = "tooie_probe(rdram, ctx, 2);"

[[patches.hook]]
func = "boot_inflate"
before_vram = 0x800007C8
text = "tooie_probe_ret(rdram, ctx, 1);"

[[patches.hook]]
func = "boot_inflate"
before_vram = 0x800007FC
text = "tooie_probe_ret(rdram, ctx, 3);"

[[patches.hook]]
func = "boot_inflate"
before_vram = 0x80000800
text = "tooie_probe_ret(rdram, ctx, 2);"

[[patches.hook]]
func = "func_80000450"
before_vram = 0x800004D0
text = "tooie_probe_slot(rdram, ctx, 1);"

[[patches.hook]]
func = "func_80000450"
before_vram = 0x800004D8
text = "tooie_probe_slot(rdram, ctx, 2);"

[[patches.hook]]
func = "func_80000450"
before_vram = 0x800004E4
text = "tooie_probe_slot(rdram, ctx, 3);"

[[patches.hook]]
func = "func_80000450"
before_vram = 0x800004EC
text = "tooie_probe_slot(rdram, ctx, 4);"

[[patches.hook]]
func = "func_80000450"
before_vram = 0x80000474
text = "tooie_probe_slot(rdram, ctx, 10);"

[[patches.hook]]
func = "func_80000450"
before_vram = 0x8000049C
text = "tooie_probe_slot(rdram, ctx, 11);"

[[patches.hook]]
func = "func_80000450"
before_vram = 0x800004C4
text = "tooie_probe_slot(rdram, ctx, 12);"

# func_80082088 polls PI status and reads the per-overlay relocation XOR key
# straight from the cartridge. Force the status read to idle, then supply the
# key from the host ROM and NOP the original cartridge load.
[[patches.instruction]]
func = "func_80082088"
vram = 0x80082138 # lw $t2, PI_STATUS_REG
value = 0x00005025 # or $t2, $zero, $zero

[[patches.hook]]
func = "func_80082088"
before_vram = 0x80082148
text = "tooie_overlay_read_relocation_key(rdram, ctx);"

[[patches.instruction]]
func = "func_80082088"
vram = 0x80082148 # lw $s5, 0x40($s5)
value = 0x00000000 # nop; host bridge populated s5

# boot_osInitialize is a boot-prefixed libultra duplicate, so N64Recomp's
# built-in osInitialize replacement does not apply. Suppress its three final
# direct AI MMIO writes; audio state is owned by the runtime's osAi* handlers.
[[patches.instruction]]
func = "boot_osInitialize"
vram = 0x80001968 # sw $t7, AI_CONTROL_REG
value = 0x00000000 # nop

[[patches.instruction]]
func = "boot_osInitialize"
vram = 0x80001974 # sw $t8, AI_DACRATE_REG
value = 0x00000000 # nop

[[patches.instruction]]
func = "boot_osInitialize"
vram = 0x80001980 # sw $t9, AI_BITRATE_REG
value = 0x00000000 # nop

# N64 maps the same RDRAM through cached KSEG0 (0x80000000) and uncached
# KSEG1 (0xA0000000). N64ModernRuntime's direct host-memory macros expose the
# KSEG0 range only. Tooie's CIC thread has exactly two KSEG1 reads of IPL3 boot
# residue, so redirect only their LUI instructions to the equivalent KSEG0
# aliases.
[[patches.instruction]]
func = "func_8001DE64"
vram = 0x8001DE70 # lui $t6, 0xA030
value = 0x3C0E8030 # lui $t6, 0x8030

[[patches.instruction]]
func = "func_8001DE64"
vram = 0x8001DE80 # lui $t8, 0xA030
value = 0x3C188030 # lui $t8, 0x8030

# Four software-FPU trampolines that save the caller's return address in a
# scratch register, call the shared routine at 0x80013ABC/0x80013818, finish the
# operation and then "return" through that register:
#
#   0x80013804  or   $a1, $ra, $zero      (func_800137F4; $a3 in 80013A5C/7C)
#   0x80013808  jal  0x80013818
#   0x80013810  jr   $a1                  <- patched
#   0x80013814  mov.s $f0, $f2            (delay slot)
#
# N64Recomp cannot resolve a register return, so it emits LOOKUP_FUNC($a1). By
# then the helper has clobbered $a1 and the dispatch aborts with
# `Failed to find function at 0x00000000` -- func_800137F4+0x5A was the first
# one the game reached (from glgamedata's entrypoint walking its export table).
# $ra still holds the original caller's return address (the helper returns
# normally through its own saved $ra), so `jr $ra` is equivalent and statically
# resolvable. The shipping reference port patches these same four words.
[[patches.instruction]]
func = "func_800137D4"
vram = 0x800137EC # jr $a1
value = 0x03E00008 # jr $ra

[[patches.instruction]]
func = "func_800137F4"
vram = 0x80013810 # jr $a1
value = 0x03E00008 # jr $ra

[[patches.instruction]]
func = "func_80013A5C"
vram = 0x80013A74 # jr $a3
value = 0x03E00008 # jr $ra

[[patches.instruction]]
func = "func_80013A7C"
vram = 0x80013A98 # jr $a3
value = 0x03E00008 # jr $ra

# TEMPORARY diagnostic: suexpression_entrypoint_10 faults on `lh $v0, 0x0($a0)`.
[[patches.hook]]
func = "suexpression_entrypoint_10"
before_vram = 0x80800428
text = "tooie_probe_kseg1_entry(rdram, ctx);"

# TEMPORARY diagnostic: func_800205D0 is the record destructor, and the only
# writer that clears an effect slot's *value* word. The level-load gate
# (func_800C2AB8 -> func_800C269C) refuses an entry while that word is non-zero,
# so whether this runs for the stuck records decides where the spin comes from.
[[patches.hook]]
func = "func_800205D0"
before_vram = 0x800205D0
text = "tooie_probe_record_free(rdram, ctx);"

# TEMPORARY diagnostic: the gfx-task callback and the record manager it drives.
[[patches.hook]]
func = "func_8001ED68"
before_vram = 0x8001ED68
text = "tooie_probe_task_dispatch(rdram, ctx, 1);"

[[patches.hook]]
func = "func_8001EE34"
before_vram = 0x8001EE34
text = "tooie_probe_task_dispatch(rdram, ctx, 2);"

# TEMPORARY diagnostic: the gate's accept/refuse decision inside the sweep.
[[patches.hook]]
func = "func_800C2AB8"
before_vram = 0x800C2B28
text = "tooie_probe_gate(rdram, ctx);"

# Gives the cooperative scheduler a preemption point at the sweep's retry
# back-edge. Tooie's cleanup loop is preemptible on hardware; the pinned
# N64ModernRuntime has no preemption point inside generated code, so the sound
# release this loop waits for is never delivered and the loop retries forever.
[[patches.hook]]
func = "func_800C2AB8"
before_vram = 0x800C2B50
text = "tooie_yield_pending_sound(rdram, ctx);"

# TEMPORARY diagnostic: chanim_entrypoint_7 is entered with a0 = NULL although
# the syscall site that dispatches it had a0 = 0x801DD74C.
[[patches.hook]]
func = "chanim_entrypoint_7"
before_vram = 0x808001F8
text = "tooie_probe_ptr(rdram, ctx, 9);"

# TEMPORARY diagnostic: func_80100094 indexes a table from (a0, a1) and faults
# when a0 is NULL; report the caller.
[[patches.hook]]
func = "func_80100094"
before_vram = 0x80100094
text = "tooie_probe_slot_table(rdram, ctx);"

# TEMPORARY diagnostic: the actor resource allocator. Every non-zero slot id
# comes from here, and a size of 0 frees the slot instead of creating it.
[[patches.hook]]
func = "func_80100074"
before_vram = 0x80100074
text = "tooie_probe_create(rdram, ctx);"

# TEMPORARY diagnostic: chintrochar's first function is the only place that
# creates the actor's slot-1 (spline/expression) resource.
[[patches.hook]]
func = "func_80800000_chintrochar"
before_vram = 0x80800000
text = "tooie_probe_actor_setup(rdram, ctx);"

# TEMPORARY diagnostic: attribute a bad actor state pointer to its actor.
[[patches.hook]]
func = "func_80100120"
before_vram = 0x8010014C
text = "tooie_probe_dispatch(rdram, ctx);"

# func_80015190 signals the frame barrier. Tooie's gfx manager pairs that signal
# with the RDP freeze func_800142F0 sets; on hardware the VI-retrace handler
# clears it once the swapped framebuffer is on screen and the in-between task
# submission re-arms the flag the next DP completion tests. With emulated
# retraces that ordering can invert: the second completed graphics task leaves
# D_80078484 at 2 while D_80078488 still holds 0x40000001, so func_800142F0
# never sends the third frame signal and the frame loop deadlocks. Keep the
# original queue send, then clear only the runtime-maintained freeze bit
# (DPC_CLR_FREEZE), as both shipping ports do for this engine's gfx manager.
[[patches.hook]]
func = "func_80015190"
before_vram = 0x800151AC
text = "tooie_clear_dp_freeze(rdram, ctx);"

# TEMPORARY diagnostic: trace the a0 passed into the overlay-load predicate.
[[patches.hook]]
func = "func_8009CC68"
before_vram = 0x8009CC68
text = "tooie_probe_ea(rdram, ctx, 0xF0);"

# TEMPORARY diagnostic: the frame pipeline. func_800151BC is the frame sync the
# main thread runs; the four recv sites below are the barrier wait, the retrace
# wait loop, the retrace drain, and the post-swap frame sync loop. func_80014A88
# is the RDP completion thread, func_800142F0 the barrier poster, and
# func_8001546C the VI worker.
[[patches.hook]]
func = "syscall_handler"
before_vram = 0x80081F24
text = "tooie_register_loaded_overlay(rdram, ctx);"

# The handler tail-jumps back through the static syscall entry after
# func_80081F64 rewrote it to `j overlay+0x10`. That address is dynamic MIPS
# code, not a native function boundary, so LOOKUP_FUNC cannot resolve it.
# Run the original jr delay-slot stack restore, then feed the rewritten
# instruction back through the host-side decoder.
[[patches.hook]]
func = "syscall_handler"
before_vram = 0x80081F5C
text = "ctx->r29 = ADD32(ctx->r29, 0x40); recomp_syscall_handler(rdram, ctx, (int32_t)ctx->r8); return;"

# Keep the runtime's loaded-function map in sync with Tooie's own overlay
# unload and heap-defragmentation paths.
[[patches.hook]]
func = "ovl_unload"
before_vram = 0x80081A20
text = "tooie_unregister_loaded_overlay(rdram, ctx);"

[[patches.hook]]
func = "ovl_shift"
before_vram = 0x80082528
text = "tooie_reregister_shifted_overlay(rdram, ctx);"

# `Aspect Ratio: Expand` widens only the projection handed to RT64. Tooie's own
# visibility tests still build their planes from the original 4:3 camera, so
# geometry in the expanded side regions is discarded by the game before any
# display list reaches RT64 and the sides render as bare background.
#
# These are the three wrappers that produce those verdicts: func_800E3D0C
# (float AABB), func_800E3DC0 (s16 AABB) and func_800E3E8C (sphere). Each leaves
# 0 in $v0 for "culled" and non-zero for "visible", so hooking the return lets
# the host turn a rejection into "visible" -- and only while the applied aspect
# ratio is Expand, so Original and Manual keep the game's exact behaviour.
[[patches.hook]]
func = "func_800E3D0C"
before_vram = 0x800E3DB8
text = "tooie_expand_visibility(rdram, ctx);"

[[patches.hook]]
func = "func_800E3DC0"
before_vram = 0x800E3E84
text = "tooie_expand_visibility(rdram, ctx);"

[[patches.hook]]
func = "func_800E3E8C"
before_vram = 0x800E3EF4
text = "tooie_expand_visibility(rdram, ctx);"

# RT64 interpolation metadata for the player model. RT64's Display/Manual
# refresh-rate modes present frames blended between the game's own 20/30 Hz
# frames, which requires knowing which transform in one frame is the same
# object as which in the next. Tooie never says, so RT64 blends matrices that
# do not correspond and the player's snout and feet shear above the game's own
# rate. These hooks add transform-group identities around the player's root and
# bone matrices and change no game matrix.
#
# func_800A73F4 builds and submits Tooie's real scene display list. RT64 resets
# the extended-GBI enable whenever a display list starts, so the enable and the
# game's live VI rate are re-emitted at its head every frame.
[[patches.hook]]
func = "func_800A73F4"
before_vram = 0x800A73F4
text = "tooie_rt64_begin_frame(rdram, ctx);"

# func_80098BA8 is the verified player draw wrapper, so its entry and exit
# bracket exactly the draws belonging to one player. The identity comes from
# the stable player-state slot, not from draw order.
[[patches.hook]]
func = "func_80098BA8"
before_vram = 0x80098BA8
text = "tooie_rt64_player_scope(rdram, ctx, 1);"

[[patches.hook]]
func = "func_80098BA8"
before_vram = 0x80098BD0
text = "tooie_rt64_player_scope(rdram, ctx, 2);"

# 0x800DF12C is where func_800DE498 has just written the root display-list
# pointer back to the graphics buffers, i.e. right after its own gSPMatrix and
# before CPU animation and the geometry walker; 0x800DF238 is the first
# instruction after Tooie restores or pops that root matrix.
[[patches.hook]]
func = "func_800DE498"
before_vram = 0x800DF12C
text = "tooie_rt64_push_player_root(rdram, ctx);"

[[patches.hook]]
func = "func_800DE498"
before_vram = 0x800DF238
text = "tooie_rt64_pop_player_root(rdram, ctx);"

# 0x800DCFC0 is table-0 command 2's shared head, reached after it has emitted
# its bone gSPMatrix; 0x800DD014 follows its own conditional gSPPopMatrix.
[[patches.hook]]
func = "func_800DCF48"
before_vram = 0x800DCFC0
text = "tooie_rt64_push_player_bone(rdram, ctx);"

[[patches.hook]]
func = "func_800DCF48"
before_vram = 0x800DD014
text = "tooie_rt64_pop_player_bone(rdram, ctx);"

# func_800BFD6C is Tooie's sky draw: it sets near/far to 5..15000, fills the
# screen, loads its own projection, then draws up to three sky layers through
# the shared model renderer (func_800DE448 -> func_800DE498) -- the same entry
# point the player uses. The scope marks those draws so the root-group hook can
# give each layer its own transform id instead of letting RT64 pair the layers
# by heuristic. L_800BFEF8 is the function's single exit, reached by both its
# early-out and its normal path, so the flag can never be left set.
[[patches.hook]]
func = "func_800BFD6C"
before_vram = 0x800BFD6C
text = "tooie_rt64_sky_scope(rdram, ctx, 1);"

[[patches.hook]]
func = "func_800BFD6C"
before_vram = 0x800BFEF8
text = "tooie_rt64_sky_scope(rdram, ctx, 2);"

# RT64 pairs a projection with the previous frame's projection *at the same index
# in the scene's projection list*, and with the default G_EX_ID_AUTO that match is
# unconditional. Tooie's projection list is not the same every frame -- the sky
# draw loads one of its own and first person (func_80093E18) loads two -- so on a
# frame where the list shifts, an AUTO projection is blended against a
# structurally different one. The sky's near-5/far-15000 build mixed with the
# gameplay camera mis-projects the sky geometry, and where it clips, the sky
# draw's own fullscreen black fill shows through: a black region that grows as
# the mismatch widens while the camera moves.
#
# Giving each projection an explicit id changes RT64's rule to "interpolate only
# against the same projection as last frame".
#
# Both hooks sit *before* the instruction that loads the display-list cursor,
# because each builder reads the cursor, writes the command at that value, then
# stores back value + 8. Appending at the write itself is emitted past the game's
# command and silently overwritten. 0x800E4598 is that load in func_800E44FC
# (cursor in $s0); 0x800E43B8 is it in func_800E42F0 (cursor at 0x34($sp)).
# func_800E4640 also writes a DA38 but its flags are 0 -- that is a modelview
# load, not a projection, so it is deliberately not tagged.
[[patches.hook]]
func = "func_800E44FC"
before_vram = 0x800E4598
text = "tooie_rt64_tag_projection(rdram, ctx, 0, (uint32_t)ctx->r16);"

[[patches.hook]]
func = "func_800E42F0"
before_vram = 0x800E43B8
text = "tooie_rt64_tag_projection(rdram, ctx, 1, (uint32_t)ctx->r29 + 0x34U);"

# The sky draw loop head. Its layer counter is $s2, and a layer is skipped
# entirely when its model bin is null, so the index has to come from the game
# rather than from a count of layers seen. The root-group hook in
# func_800DE498 reads it to give each sky layer its own transform id.
[[patches.hook]]
func = "func_800BFD6C"
before_vram = 0x800BFDF8
text = "tooie_rt64_sky_layer(rdram, ctx);"

